    # ─── Import ────────────────────────────────────────────────────────────────

    ImportResult:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        messages:
          type: array
          items:
            type: string
      required:
        - inserted

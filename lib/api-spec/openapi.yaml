  # ─── Photo Library ────────────────────────────────────────────────────────────

  /photo-library/finalize-upload:
    post:
      operationId: finalizePhotoUpload
      tags: [photoLibrary]
      summary: |
        Finalize a worker photo upload after the file lands in object storage.
        Server fetches the original, extracts EXIF (GPS + timestamp), generates
        a 512px thumbnail, persists Media row, and queues an analysis job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "201":
          description: Photo committed to library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeUploadResponse"

  /photo-library/photos:
    get:
      operationId: listPhotos
      tags: [photoLibrary]
      summary: List photos with filters (purpose, tree, grove, date)
      parameters:
        - in: query
          name: treeId
          schema: { type: integer }
        - in: query
          name: groveId
          schema: { type: integer }
        - in: query
          name: purpose
          schema: { type: string }
        - in: query
          name: hasAnalysis
          schema: { type: boolean }
        - in: query
          name: matchStatus
          description: |
            Filter by photo→tree auto-link diagnostic. One of:
            linked_explicit, linked_gps, unlinked_no_gps, unlinked_no_match,
            unlinked_exif_error.
          schema:
            type: string
            enum:
              - linked_explicit
              - linked_gps
              - unlinked_no_gps
              - unlinked_no_match
              - unlinked_exif_error
        - in: query
          name: unlinked
          description: When true, return only photos with no treeId (any reason).
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhotoLibraryItem"

  /photo-library/photos/bulk-link:
    post:
      operationId: bulkLinkPhotos
      tags: [photoLibrary]
      summary: |
        Manager-only manual recovery for unlinked photos. Sets treeId and/or
        groveId on every supplied media row, promotes the legacy entityType
        to "tree" when a treeId is supplied, and writes one audit row per
        updated id. At least one of treeId/groveId must be set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLinkPhotosRequest"
      responses:
        "200":
          description: Updated photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLinkPhotosResponse"

  /photo-library/photos/relink:
    post:
      operationId: relinkPhotos
      tags: [photoLibrary]
      summary: |
        Re-link a set of already-uploaded photos to a different entity.
        Used by capture-first flows that stage photos before the parent record
        (visit, harvest event, etc.) exists, then attach them after the parent
        is created. Only updates linkedEntityType / linkedEntityId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelinkPhotosRequest"
      responses:
        "200":
          description: Updated photos
          content:
            application/json:
              schema:
                type: object
                required: [updated, requested, failedIds]
                properties:
                  updated: { type: integer }
                  requested: { type: integer }
                  failedIds:
                    type: array
                    items: { type: integer }

  /photo-library/sweep-pending:
    post:
      operationId: sweepPendingPhotos
      tags: [photoLibrary]
      summary: |
        Manager-only sweep that deletes worker capture-first photos still tagged
        with a "*_pending" linkedEntityType after the configured TTL has elapsed.
        Removes the underlying object-storage file, the media row, and any
        dependent photo_batch_items / photo_analysis_jobs / photo_analysis_results
        rows, and writes one audit_events row per deleted media id.
        Also runs periodically as a server-side scheduled task; this endpoint is
        for manual / on-demand invocation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SweepPendingPhotosRequest"
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepPendingPhotosResponse"

  /photo-library/trees/{treeId}/timeline:
    get:
      operationId: getTreePhotoTimeline

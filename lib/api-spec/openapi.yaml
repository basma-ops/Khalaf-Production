        - geojson

    ImportObservationsRequest:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
        imageryAcquisitionId:
          type: integer
        sourceFile:
          type: string
          nullable: true
      required:
        - records
        - imageryAcquisitionId

    ImportAlertsRequest:
      type: object
      properties:
        geojson:
          type: object
        sourceFile:
          type: string
          nullable: true

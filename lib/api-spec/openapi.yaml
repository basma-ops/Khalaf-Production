openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Khalaf Olive Groves - Ancient Grove Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: groves
    description: Grove management
  - name: trees
    description: Tree registry
  - name: satellite
    description: Satellite observations and alerts
  - name: heritage
    description: Heritage rules
  - name: tasks
    description: Task management
  - name: fieldVisits
    description: Field visit records
  - name: harvest
    description: Harvest events and traceability
  - name: batches
    description: Harvest batches
  - name: pressing
    description: Pressing runs and oil batches
  - name: labs
    description: Lab results
  - name: bottling
    description: Bottling runs and bottle ↔ tree traceability
  - name: media
    description: Media uploads
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: import
    description: Data import workflow
  - name: ai
    description: AI grove interpreter
  - name: storage
    description: Object storage uploads and downloads
  - name: photoLibrary
    description: Photo library (worker uploads, per-tree timeline)
  - name: photoAnalysis
    description: Visual tree intelligence (auto-analysis + manager review)
  - name: sensors
    description: Sensor streams and ingestion (Phase 4)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Main dashboard KPIs
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /dashboard/harvest-summary:
    get:
      operationId: getDashboardHarvestSummary
      tags: [dashboard]
      summary: Active harvest season summary
      responses:
        "200":
          description: Harvest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestSummary"

  /dashboard/alert-breakdown:
    get:
      operationId: getDashboardAlertBreakdown
      tags: [dashboard]
      summary: Alert counts by severity and type
      responses:
        "200":
          description: Alert breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertBreakdown"

  /dashboard/heritage-signals:
    get:
      operationId: getDashboardHeritageSignals
      tags: [dashboard]
      summary: Heritage rule signal summary
      responses:
        "200":
          description: Heritage signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeritageSignal"

  # ─── Users ───────────────────────────────────────────────────────────────────

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - in: query
          name: role
          schema:
            type: string
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Groves ──────────────────────────────────────────────────────────────────

  /groves:
    get:
      operationId: listGroves
      tags: [groves]
      summary: List all groves
      responses:
        "200":
          description: List of groves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grove"
    post:
      operationId: createGrove
      tags: [groves]
      summary: Create a grove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroveRequest"
      responses:
        "201":
          description: Created grove
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grove"

  /groves/{id}:
    get:
      operationId: getGrove
      tags: [groves]
      summary: Get grove by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grove
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grove"
    patch:
      operationId: updateGrove
      tags: [groves]
      summary: Update a grove
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroveRequest"
      responses:
        "200":
          description: Updated grove
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grove"

  /groves/{id}/summary:
    get:
      operationId: getGroveSummary
      tags: [groves]
      summary: Grove summary with tree/alert/task counts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grove summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroveSummary"

  # ─── Trees ───────────────────────────────────────────────────────────────────

  /trees:
    get:
      operationId: listTrees
      tags: [trees]
      summary: List trees with filters
      parameters:
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: treeType
          schema:
            type: string
        - in: query
          name: ancientStatus
          schema:
            type: string
        - in: query
          name: verificationStatus
          schema:
            type: string
        - in: query
          name: currentAlertStatus
          schema:
            type: string
        - in: query
          name: harvestStatus
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of trees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeListResponse"
    post:
      operationId: createTree
      tags: [trees]
      summary: Create a tree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTreeRequest"
      responses:
        "201":
          description: Created tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"

  /trees/{id}:
    get:
      operationId: getTree
      tags: [trees]
      summary: Get tree by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
    patch:
      operationId: updateTree
      tags: [trees]
      summary: Update a tree
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTreeRequest"
      responses:
        "200":
          description: Updated tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
    delete:
      operationId: deleteTree
      tags: [trees]
      summary: Delete a tree (manager only)
      description: |
        Removes the tree row and any media linked to it. Used by the
        in-field validator app when a manager confirms a satellite-detected
        tree does not actually exist on the ground. Manager session required.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Tree deleted

  /trees/{id}/timeline:
    get:
      operationId: getTreeTimeline
      tags: [trees]
      summary: Full timeline for a tree
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tree timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeTimeline"

  /trees/{id}/observations:
    get:
      operationId: getTreeObservations
      tags: [trees]
      summary: Satellite observations for a tree
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeSatelliteObservation"

  /trees/map-data:
    get:
      operationId: getTreesMapData
      tags: [trees]
      summary: Lightweight tree data for map rendering
      parameters:
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: colorBy
          schema:
            type: string
            enum: [health, alert, harvest, ancient]
      responses:
        "200":
          description: Map-optimized tree data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeMapPoint"

  # ─── Satellite Observations ───────────────────────────────────────────────────

  /satellite-observations:
    get:
      operationId: listSatelliteObservations
      tags: [satellite]
      summary: List satellite observations
      parameters:
        - in: query
          name: treeId
          schema:
            type: integer
        - in: query
          name: acquisitionId
          schema:
            type: integer
      responses:
        "200":
          description: Observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeSatelliteObservation"
    post:
      operationId: createSatelliteObservation
      tags: [satellite]
      summary: Create satellite observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSatelliteObservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSatelliteObservation"

  /imagery-acquisitions:
    get:
      operationId: listImageryAcquisitions
      tags: [satellite]
      summary: List imagery acquisitions
      responses:
        "200":
          description: Acquisitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImageryAcquisition"
    post:
      operationId: createImageryAcquisition
      tags: [satellite]
      summary: Create imagery acquisition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageryAcquisitionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageryAcquisition"

  # ─── Satellite Alerts ─────────────────────────────────────────────────────────

  /satellite-alerts:
    get:
      operationId: listSatelliteAlerts
      tags: [satellite]
      summary: List satellite alerts
      parameters:
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: treeId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
        - in: query
          name: alertType
          schema:
            type: string
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SatelliteAlert"
    post:
      operationId: createSatelliteAlert
      tags: [satellite]
      summary: Create satellite alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSatelliteAlertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatelliteAlert"

  /satellite-alerts/{id}:
    get:
      operationId: getSatelliteAlert
      tags: [satellite]
      summary: Get alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatelliteAlert"
    patch:
      operationId: updateSatelliteAlert
      tags: [satellite]
      summary: Update alert status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSatelliteAlertRequest"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatelliteAlert"

  # ─── Heritage Rules ───────────────────────────────────────────────────────────

  /heritage-rules:
    get:
      operationId: listHeritageRules
      tags: [heritage]
      summary: List heritage rules
      responses:
        "200":
          description: Heritage rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeritageRule"
    post:
      operationId: createHeritageRule
      tags: [heritage]
      summary: Create heritage rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHeritageRuleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageRule"

  /heritage-rules/{id}:
    get:
      operationId: getHeritageRule
      tags: [heritage]
      summary: Get heritage rule by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Heritage rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageRule"
    patch:
      operationId: updateHeritageRule
      tags: [heritage]
      summary: Update heritage rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHeritageRuleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeritageRule"

  /heritage-rules/{id}/evidence:
    get:
      operationId: getHeritageRuleEvidence
      tags: [heritage]
      summary: Get evidence linked to a heritage rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleEvidence"

  # ─── Tasks ────────────────────────────────────────────────────────────────────

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: assignedToUserId
          schema:
            type: integer
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: treeId
          schema:
            type: integer
        - in: query
          name: taskType
          schema:
            type: string
        - in: query
          name: satelliteAlertId
          schema:
            type: integer
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Cancel/delete task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  # ─── Field Visits ─────────────────────────────────────────────────────────────

  /field-visits:
    get:
      operationId: listFieldVisits
      tags: [fieldVisits]
      summary: List field visits
      parameters:
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: treeId
          schema:
            type: integer
        - in: query
          name: workerId
          schema:
            type: integer
        - in: query
          name: taskId
          schema:
            type: integer
      responses:
        "200":
          description: Field visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldVisit"
    post:
      operationId: createFieldVisit
      tags: [fieldVisits]
      summary: Submit a field visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFieldVisitRequest"
      responses:
        "201":
          description: Created field visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldVisit"

  /field-visits/{id}:
    get:
      operationId: getFieldVisit
      tags: [fieldVisits]
      summary: Get field visit by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Field visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldVisit"
    patch:
      operationId: updateFieldVisit
      tags: [fieldVisits]
      summary: Update field visit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFieldVisitRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldVisit"

  # ─── Harvest Seasons ──────────────────────────────────────────────────────────

  /harvest-seasons:
    get:
      operationId: listHarvestSeasons
      tags: [harvest]
      summary: List harvest seasons
      responses:
        "200":
          description: Seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HarvestSeason"
    post:
      operationId: createHarvestSeason
      tags: [harvest]
      summary: Create harvest season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHarvestSeasonRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestSeason"

  /harvest-seasons/{id}:
    patch:
      operationId: updateHarvestSeason
      tags: [harvest]
      summary: Update harvest season
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHarvestSeasonRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestSeason"

  # ─── Harvest Events ───────────────────────────────────────────────────────────

  /harvest-events:
    get:
      operationId: listHarvestEvents
      tags: [harvest]
      summary: List harvest events
      parameters:
        - in: query
          name: groveId
          schema:
            type: integer
        - in: query
          name: treeId
          schema:
            type: integer
        - in: query
          name: seasonId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: workerId
          schema:
            type: integer
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Harvest events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HarvestEvent"
    post:
      operationId: createHarvestEvent
      tags: [harvest]
      summary: Start a tree harvest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHarvestEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestEvent"

  /harvest-events/{id}:
    get:
      operationId: getHarvestEvent
      tags: [harvest]
      summary: Get harvest event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Harvest event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestEvent"
    patch:
      operationId: updateHarvestEvent
      tags: [harvest]
      summary: Update harvest event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHarvestEventRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestEvent"

  /harvest-events/{id}/workers:
    get:
      operationId: getHarvestEventWorkers
      tags: [harvest]

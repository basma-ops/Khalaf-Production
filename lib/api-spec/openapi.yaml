          type: string
          enum: [manual, station, import, other]
          nullable: true
        notes: { type: string, nullable: true }

    WeatherSummary:
      type: object
      required: [groveId, year, entryCount]
      properties:
        groveId: { type: integer }
        year: { type: integer }
        entryCount: { type: integer }
        cumulativeRainfallMm: { type: number, nullable: true }
        avgTempMinC: { type: number, nullable: true }
        avgTempMaxC: { type: number, nullable: true }
        avgHumidityPct: { type: number, nullable: true }
        totalLeafWetnessHours: { type: number, nullable: true }
        longTermAvgRainfallMm: { type: number, nullable: true }
        longTermYears: { type: integer }
        firstObservedDate: { type: string, nullable: true }
        lastObservedDate: { type: string, nullable: true }
        firstRainDate: { type: string, nullable: true, description: "First day of season with rainfall_mm > 0" }

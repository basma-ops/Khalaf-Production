        totalLitersBottled: { type: number, nullable: true }
        label: { type: string, nullable: true }
        labelTemplate: { type: string, nullable: true }
        lotCode: { type: string, nullable: true }
        singleTree: { type: boolean }
        singleGrove: { type: boolean }
        status: { type: string }
        qualityBasisLabResultIds:
          type: array
          nullable: true
          items: { type: integer }
        notes: { type: string, nullable: true }


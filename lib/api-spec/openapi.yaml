          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSensorReadingsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Dashboard ─────────────────────────────────────────────────────────────

    DashboardOverview:
      type: object
      properties:
        totalGroves:

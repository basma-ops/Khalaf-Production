        - errors
        - messages

    ImportPreview:
      type: object
      properties:
        fileType:
          type: string
        rowCount:
          type: integer
        preview:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
      required:
        - fileType
        - rowCount
        - preview
        - warnings

    ImportGrovesRequest:
      type: object
      properties:

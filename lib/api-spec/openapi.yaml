    HarvestReportLabRow:
      type: object
      properties:
        id: { type: integer }
        attributionLevel: { type: string }
        oilBatchCode: { type: string, nullable: true }
        labName: { type: string, nullable: true }
        sampleDate: { type: string, nullable: true }
        acidity: { type: number, nullable: true }
        peroxideValue: { type: number, nullable: true }
        totalPolyphenolsMgKg: { type: number, nullable: true }

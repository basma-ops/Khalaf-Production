              seasonName: { type: string, nullable: true }
              millName: { type: string, nullable: true }
              pressingDelayHours: { type: number, nullable: true }
        origins:
          type: array
          items:
            $ref: "#/components/schemas/BottleOrigin"
        totalContributionKg: { type: number, nullable: true }
        totalLitersDrawn: { type: number, nullable: true }
        treeCount: { type: integer }
        groveBreakdown:
          type: array
          items:
            type: object
            required: [groveId, groveName, contributionKg, sharePct, treeCount]
            properties:
              groveId: { type: integer, nullable: true }
              groveName: { type: string, nullable: true }
              contributionKg: { type: number }
              sharePct: { type: number }
              treeCount: { type: integer }
        topTrees:
          type: array
          description: "Top 25 contributing trees by share, with primary photo url when available."
          items:
            type: object
            required: [treeId, sharePct, contributionKg]
            properties:
              treeId: { type: integer }
              treeCode: { type: string, nullable: true }
              groveId: { type: integer, nullable: true }
              groveName: { type: string, nullable: true }
              variety: { type: string, nullable: true }
              ancientStatus: { type: string, nullable: true }
              contributionKg: { type: number }
              sharePct: { type: number }
              photoUrl: { type: string, nullable: true }
        heritageEvidence:
          type: array
          description: "Heritage rule evidence rows touched by trees, groves, or harvest batches in this trace."
          items:
            type: object
            required: [id, heritageRuleId, ruleCode, ruleName, metricName, metricValue, confidenceLevel]
            properties:
              id: { type: integer }
              heritageRuleId: { type: integer }
              ruleCode: { type: string }
              ruleName: { type: string }
              treeId: { type: integer, nullable: true }
              groveId: { type: integer, nullable: true }
              harvestBatchId: { type: integer, nullable: true }
              metricName: { type: string }
              metricValue: { type: string }
              interpretation: { type: string, nullable: true }
              confidenceLevel: { type: string }
        labResults:
          type: array
          items:
            $ref: "#/components/schemas/LabResult"

    PublicBottleDossier:
      type: object
      required: [bottlingRun, sources, treeCount, groveBreakdown, topTrees, labResults, totalContributionKg, totalLitersDrawn]
      description: Sanitized public payload for /bottle/:token. Excludes internal notes and raw lab IDs.
      properties:
        bottlingRun:
          type: object
          required: [runCode, bottledAt, status, singleTree, singleGrove, publicToken]
          properties:
            runCode: { type: string }
            bottledAt: { type: string }
            label: { type: string, nullable: true }
            lotCode: { type: string, nullable: true }
            format: { type: string, nullable: true }
            bottleSizeMl: { type: integer, nullable: true }
            bottlesProduced: { type: integer, nullable: true }
            totalLitersBottled: { type: number, nullable: true }
            singleTree: { type: boolean }
            singleGrove: { type: boolean }
            status: { type: string }
            publicToken: { type: string }
        sources:
          type: array
          description: Per-oil-batch upstream chain (mill, season, pressing delay) for the curious.
          items:
            type: object
            required: [oilBatchCode, litersDrawn]
            properties:
              oilBatchCode: { type: string, nullable: true }
              litersDrawn: { type: number }
              batchCode: { type: string, nullable: true }
              seasonName: { type: string, nullable: true }
              millName: { type: string, nullable: true }
              pressingDelayHours: { type: number, nullable: true }
              harvestDate: { type: string, nullable: true, description: "Harvest batch date (ISO date)." }
              pressingStartedAt: { type: string, nullable: true, description: "Pressing run start (ISO datetime)." }
              pressingCompletedAt: { type: string, nullable: true, description: "Pressing run completion (ISO datetime)." }
        totalContributionKg: { type: number }
        totalLitersDrawn: { type: number }
        treeCount: { type: integer }
        groveBreakdown:
          type: array
          items:
            type: object
            required: [groveName, contributionKg, sharePct, treeCount]
            properties:
              groveName: { type: string, nullable: true }
              groveCode: { type: string, nullable: true }
              contributionKg: { type: number }
              sharePct: { type: number }
              treeCount: { type: integer }
        topTrees:
          type: array
          items:
            type: object
            required: [treeId, treeCode, contributionKg, sharePct]
            properties:
              treeId: { type: integer }
              treeCode: { type: string }
              groveName: { type: string, nullable: true }
              variety: { type: string, nullable: true }
              ancientStatus: { type: string, nullable: true }
              estimatedAgeClass: { type: string, nullable: true }
              crownDiameterM: { type: number, nullable: true }
              contributionKg: { type: number }
              sharePct: { type: number }
              photoUrl: { type: string, nullable: true }
        labResults:
          type: array
          description: Cautious public-facing lab summaries with derived EVOO + health-claim flags.
          items:
            type: object
            properties:
              sampleDate: { type: string, nullable: true }
              labName: { type: string, nullable: true }
              acidity: { type: number, nullable: true }
              peroxideValue: { type: number, nullable: true }
              totalPolyphenolsMgKg: { type: number, nullable: true }
              k232: { type: number, nullable: true }
              k270: { type: number, nullable: true }
              isExtraVirgin: { type: boolean, nullable: true }
              isHealthClaimEligible: { type: boolean, nullable: true }

    PublicTreeProfile:
      type: object
      required: [id, treeCode]
      properties:
        id: { type: integer }
        treeCode: { type: string }
        variety: { type: string, nullable: true }
        ancientStatus: { type: string, nullable: true }
        estimatedAgeClass: { type: string, nullable: true }
        crownDiameterM: { type: number, nullable: true }
        crownAreaM2: { type: number, nullable: true }
        currentHealthIndex: { type: number, nullable: true }
        groveName: { type: string, nullable: true }
        groveCode: { type: string, nullable: true }
        centroidLat: { type: number, nullable: true }
        centroidLon: { type: number, nullable: true }
        photoCount: { type: integer }
        photos:
          type: array
          description: Up to 6 most recent photos for this tree.
          items:
            type: object
            required: [id, fileUrl]
            properties:
              id: { type: integer }
              fileUrl: { type: string }
              thumbnailUrl: { type: string, nullable: true }
              capturedAt: { type: string, nullable: true }

    # ─── Year Report ───────────────────────────────────────────────────────────

    YearRainfallPoint:
      type: object
      required: [month, currentMm, longTermAvgMm]
      properties:
        month: { type: integer, description: "1-12" }
        currentMm: { type: number }
        longTermAvgMm: { type: number, nullable: true }

    YearPhenologyShift:
      type: object
      required: [bbchStage]
      properties:
        bbchStage: { type: string }
        thisYearFirstObserved: { type: string, nullable: true, format: date }
        priorYearFirstObserved: { type: string, nullable: true, format: date }
        shiftDays: { type: integer, nullable: true }

    YearPestPressurePoint:
      type: object
      required: [month, trapCount, scoutingFinds]
      properties:
        month: { type: integer }
        trapCount: { type: integer }
        scoutingFinds: { type: integer }

    YearActivityTotal:
      type: object
      required: [activityType, count]
      properties:
        activityType: { type: string }
        count: { type: integer }
        totalDurationMinutes: { type: integer, nullable: true }

    YearOilQualityHighlight:
      type: object
      required: [labResultId]
      properties:
        labResultId: { type: integer }
        oilBatchCode: { type: string, nullable: true }
        sampleDate: { type: string, nullable: true }
        acidity: { type: number, nullable: true }
        peroxideValue: { type: number, nullable: true }
        totalPolyphenolsMgKg: { type: number, nullable: true }

    YearBottlingFormat:
      type: object
      required: [format, bottles, liters]
      properties:
        format: { type: string, nullable: true }
        bottles: { type: integer }
        liters: { type: number }

    YearHeritageRuleDelta:
      type: object
      required: [heritageRuleId, ruleCode, ruleName, status, evidenceCountThisYear, evidenceCountPriorYear, deltaCount]
      properties:
        heritageRuleId: { type: integer }
        ruleCode: { type: string }
        ruleName: { type: string }
        status: { type: string }
        evidenceCountThisYear: { type: integer }
        evidenceCountPriorYear: { type: integer }
        deltaCount: { type: integer }

    YearReport:
      type: object
      required:
        - year
        - rainfall
        - phenologyShifts
        - pestPressure
        - treatments
        - activityTotals
        - harvest
        - oilQuality
        - bottling
        - heritage
      properties:
        year: { type: integer }
        rainfall:
          type: array
          items: { $ref: "#/components/schemas/YearRainfallPoint" }
        phenologyShifts:
          type: array
          items: { $ref: "#/components/schemas/YearPhenologyShift" }
        pestPressure:
          type: array
          items: { $ref: "#/components/schemas/YearPestPressurePoint" }
        treatments:
          type: object
          required: [count, byKind]
          properties:
            count: { type: integer }
            byKind:
              type: array
              items:
                type: object
                required: [treatmentKind, count]
                properties:
                  treatmentKind: { type: string }
                  count: { type: integer }
        activityTotals:
          type: array
          items: { $ref: "#/components/schemas/YearActivityTotal" }
        pruningCount: { type: integer }
        harvest:
          type: object
          required: [totalKg]
          properties:
            seasonId: { type: integer, nullable: true }
            seasonName: { type: string, nullable: true }
            totalKg: { type: number }
            meanJaen: { type: number, nullable: true }
            meanPressingDelayHours: { type: number, nullable: true }
        oilQuality:
          type: object
          required: [bestAcidity, worstAcidity, highestPolyphenols]
          properties:
            bestAcidity:
              oneOf:
                - { $ref: "#/components/schemas/YearOilQualityHighlight" }
                - { type: "null" }
            worstAcidity:
              oneOf:
                - { $ref: "#/components/schemas/YearOilQualityHighlight" }
                - { type: "null" }
            highestPolyphenols:
              oneOf:
                - { $ref: "#/components/schemas/YearOilQualityHighlight" }
                - { type: "null" }
        bottling:
          type: object
          required: [runs, totalLitersBottled, formats]
          properties:
            runs: { type: integer }
            totalLitersBottled: { type: number }
            formats:
              type: array
              items: { $ref: "#/components/schemas/YearBottlingFormat" }
        heritage:
          type: array
          items: { $ref: "#/components/schemas/YearHeritageRuleDelta" }

    # ─── Compliance Export ─────────────────────────────────────────────────────

    ComplianceTreatmentRow:
      type: object
      required:
        - id
        - appliedAt
        - product
        - method
        - withholdingDays
        - groveId
      properties:
        id: { type: integer }
        appliedAt: { type: string, format: date-time }
        groveId: { type: integer }
        groveName: { type: string, nullable: true }
        treatmentKind: { type: string, nullable: true }
        product: { type: string }
        activeIngredient: { type: string, nullable: true }
        rate: { type: number, nullable: true }
        rateUnit: { type: string, nullable: true }
        method: { type: string }
        areaHectares: { type: number, nullable: true }
        treesAffectedCount: { type: integer, nullable: true }
        withholdingDays: { type: integer }
        weatherConditions: { type: string, nullable: true }
        applicatorWorkerId: { type: integer, nullable: true }
        applicatorName: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    # ─── Heritage Evidence Summary ─────────────────────────────────────────────

    HeritageEvidenceSummary:
      type: object
      required: [heritageRuleId, year, totalCount, byKind, byMonth]
      properties:
        heritageRuleId: { type: integer }
        year: { type: integer, nullable: true }
        totalCount: { type: integer }
        byKind:
          type: array
          items:
            type: object
            required: [kind, count]
            properties:
              kind: { type: string, description: "satellite | fieldVisit | harvestEvent | harvestBatch | labResult | grove | tree" }
              count: { type: integer }
        byMonth:
          type: array
          items:
            type: object
            required: [month, count]
            properties:
              month: { type: integer, description: "1-12" }
              count: { type: integer }

    # ─── Sensors (Phase 4) ─────────────────────────────────────────────────────

    SensorKind:
      type: object
      required: [kind, unit, description]
      properties:
        kind: { type: string }
        unit: { type: string }
        description: { type: string }
        valueShape: { type: string, description: "numeric | event" }

    SensorStreamSummary:
      type: object
      required:
        - id
        - kind
        - unit
        - sampleIntervalSeconds
        - source
        - status
        - createdAt
        - isStale
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        kind: { type: string }
        attachedEntityType: { type: string, nullable: true }
        attachedEntityId: { type: integer, nullable: true }
        attachedEntityLabel: { type: string, nullable: true }
        unit: { type: string }
        sampleIntervalSeconds: { type: integer }
        source: { type: string }
        status: { type: string }
        calibrationJson:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastValueNumeric: { type: number, nullable: true }
        lastObservedAt: { type: string, format: date-time, nullable: true }
        isStale: { type: boolean, description: "true when lastSeenAt is older than 2× sampleIntervalSeconds" }
        createdAt: { type: string, format: date-time }

    CreateSensorStreamRequest:
      type: object
      required: [kind, unit, sampleIntervalSeconds]
      properties:
        name: { type: string, nullable: true }
        kind: { type: string }
        attachedEntityType: { type: string, nullable: true, description: "tree | grove | global" }
        attachedEntityId: { type: integer, nullable: true }
        unit: { type: string }
        sampleIntervalSeconds: { type: integer, minimum: 1 }
        source: { type: string, nullable: true }
        calibrationJson:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        status: { type: string, nullable: true }

    UpdateSensorStreamRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        attachedEntityType: { type: string, nullable: true }
        attachedEntityId: { type: integer, nullable: true }
        sampleIntervalSeconds: { type: integer, minimum: 1 }
        source: { type: string }
        calibrationJson:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        status: { type: string }

    SensorStreamToken:
      type: object
      required: [streamId, apiToken]
      properties:
        streamId: { type: integer }
        apiToken: { type: string, description: "Opaque token. Shown ONCE — store it now." }

    SensorStreamWithToken:
      allOf:
        - $ref: "#/components/schemas/SensorStreamSummary"
        - type: object
          required: [apiToken]
          properties:
            apiToken: { type: string, description: "Opaque token. Shown ONCE — store it now." }

    SensorReading:
      type: object
      required: [id, streamId, observedAt, qualityFlag, ingestedAt]
      properties:
        id: { type: integer }
        streamId: { type: integer }
        observedAt: { type: string, format: date-time }
        valueNumeric: { type: number, nullable: true }
        valueJson:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        qualityFlag: { type: string }
        ingestedAt: { type: string, format: date-time }

    SensorReadingInput:
      type: object
      required: [observedAt]
      properties:
        observedAt: { type: string, format: date-time }
        valueNumeric: { type: number, nullable: true }
        valueJson:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        qualityFlag: { type: string, nullable: true }

    IngestSensorReadingsRequest:
      oneOf:
        - $ref: "#/components/schemas/SensorReadingInput"
        - type: object
          required: [readings]
          properties:
            readings:
              type: array
              items: { $ref: "#/components/schemas/SensorReadingInput" }

    IngestSensorReadingsResponse:
      type: object
      required: [inserted]
      properties:
        inserted: { type: integer }
        lastSeenAt: { type: string, format: date-time }

        bottledAt: { type: string }
        label: { type: string, nullable: true }
        lotCode: { type: string, nullable: true }
        bottlesProduced: { type: integer, nullable: true }
        bottleSizeMl: { type: integer, nullable: true }
        contributionKg: { type: number }
        sharePct: { type: number }
        estimatedBottlesShare: { type: number, nullable: true }

    LotTraceReport:
      type: object
      required: [bottlingRun, sources, origins, treeCount, groveBreakdown, topTrees, heritageEvidence, labResults]
      properties:
        bottlingRun:
          $ref: "#/components/schemas/BottlingRun"
        sources:
          type: array
          items:
            type: object
            required: [oilBatchId, litersDrawn]
            properties:
              oilBatchId: { type: integer }
              oilBatchCode: { type: string, nullable: true }
              litersDrawn: { type: number }
              pressingRunId: { type: integer, nullable: true }
              harvestBatchId: { type: integer, nullable: true }
              batchCode: { type: string, nullable: true }

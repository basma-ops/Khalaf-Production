    # ─── AI ────────────────────────────────────────────────────────────────────

    AiQueryRequest:
      type: object
      properties:
        question:
          type: string
        context:
          type: object
          nullable: true
      required:
        - question

    AiQueryResponse:
      type: object
      properties:
        answer:
          type: string
        dataPoints:
          type: array
          items:
            type: object
        confidence:
          type: string
          enum: [low, medium, high]
          nullable: true
        sources:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
      required:
        - answer
        - dataPoints
        - sources
        - generatedAt

    AiInsightsRequest:
      type: object
      properties:
        groveId:
          type: integer
          nullable: true
          description: Restrict the gathered window to a single grove. Omit to summarize across the whole estate.
        focus:
          type: string
          nullable: true
          enum: [pest_disease, weather, harvest_readiness, oil_quality, general]
          description: Steer the model toward a single concern. Defaults to `general`.
        lookbackDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
          description: Window of recent records to include (default 14).

    AiInsightCitation:
      type: object
      required: [recordType, recordId, summary]
      properties:
        recordType:
          type: string
          enum: [satellite_alert, pest_find, lab_result, weather_log, bottling_run, phenology_event, harvest_event, treatment]
        recordId: { type: integer }
        summary: { type: string }

    AiInsightItem:
      type: object
      required: [headline, body, severity, citations]
      properties:
        headline: { type: string }
        body: { type: string }
        severity:
          type: string
          enum: [info, watch, action_recommended]
        suggestedTaskType:
          type: string
          nullable: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AiInsightCitation"

    AiInsightsResponse:
      type: object
      required: [summary, insights, limitations, generatedAt, model, recordCounts]
      properties:
        summary: { type: string }
        insights:
          type: array
          items:
            $ref: "#/components/schemas/AiInsightItem"
        limitations:
          type: string
          description: Required cautious-language disclaimer explaining what the model could and could not assess.
        generatedAt:
          type: string
          format: date-time
        model:
          type: string
        recordCounts:
          type: object
          additionalProperties:
            type: integer

    LiveWeatherCurrent:
      type: object
      required: [tempC, windKph, humidityPct, observedAt]
      properties:
        tempC: { type: number }
        windKph: { type: number }
        humidityPct: { type: number }
        precipMm: { type: number, nullable: true }
        weatherCode: { type: integer, nullable: true }
        observedAt: { type: string, format: date-time }

    LiveWeatherDaily:
      type: object
      required: [date, tempMinC, tempMaxC, precipMm]
      properties:
        date: { type: string, format: date }
        tempMinC: { type: number }
        tempMaxC: { type: number }
        precipMm: { type: number }
        windMaxKph: { type: number, nullable: true }
        weatherCode: { type: integer, nullable: true }

    LiveWeather:
      type: object
      required: [groveId, lat, lon, current, forecast, source, fetchedAt, cacheExpiresAt]
      properties:
        groveId: { type: integer }
        groveName: { type: string, nullable: true }
        lat: { type: number }
        lon: { type: number }
        source: { type: string }
        fetchedAt: { type: string, format: date-time }
        cacheExpiresAt: { type: string, format: date-time }
        current:
          $ref: "#/components/schemas/LiveWeatherCurrent"
        forecast:
          type: array
          items:
            $ref: "#/components/schemas/LiveWeatherDaily"

    YieldForecastBasis:
      type: object
      required: [factor, value, weight]
      properties:
        factor:
          type: string
          enum: [prior_season_kg, bbch_stage, jaen_score, phenology_shift_days, area_ha]
        value: { type: string }
        weight: { type: number }

    YieldForecastGrove:
      type: object
      required: [groveId, groveName, estimatedKg, confidence, basis]
      properties:
        groveId: { type: integer }
        groveName: { type: string }
        areaHa:
          type: number
          nullable: true
        priorSeasonKg:
          type: number
          nullable: true
        latestBbchStage:
          type: string
          nullable: true
        latestJaenScore:
          type: number
          nullable: true
        predictedHarvestStart:
          type: string
          format: date
          nullable: true
        predictedHarvestEnd:
          type: string
          format: date
          nullable: true
        estimatedKg: { type: number }
        estimatedKgLow: { type: number }
        estimatedKgHigh: { type: number }
        confidence:
          type: string
          enum: [low, medium, high]
        basis:
          type: array
          items:
            $ref: "#/components/schemas/YieldForecastBasis"

    YieldForecastResponse:
      type: object
      required: [seasonId, seasonName, generatedAt, totalEstimatedKg, groves]
      properties:
        seasonId:
          type: integer
          nullable: true
        seasonName:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
        totalEstimatedKg: { type: number }
        groves:
          type: array
          items:
            $ref: "#/components/schemas/YieldForecastGrove"
        limitations:
          type: string

    # ─── Storage / Photo Library / Photo Analysis ─────────────────────────────

    EstablishSessionRequest:
      type: object
      required: [kind]
      description: Discriminated by `kind`. Worker → userId, manager → MANAGER_PIN.
      properties:
        kind:
          type: string
          enum: [worker, manager]
        userId:
          type: integer
          nullable: true
        pin:
          type: string
          nullable: true

    SessionPrincipal:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [worker, manager]
        userId:
          type: integer
          nullable: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }

    FinalizeUploadRequest:
      type: object
      required: [objectPath, originalFileName, contentType, fileSizeBytes, purpose]
      # NOTE: `uploadedByUserId` is intentionally NOT in this schema.
      # The server derives the uploader's userId from the worker's session
      # cookie so the audit field cannot be spoofed by a client.
      properties:
        objectPath: { type: string }
        originalFileName: { type: string }
        contentType: { type: string }
        fileSizeBytes: { type: integer }
        purpose:
          type: string
          enum: [general, pre_harvest, box, pest, disease, damage, pruning_before, pruning_after, growth, pdf]
        treeId:
          type: integer
          nullable: true
        groveId:
          type: integer
          nullable: true
        zone:
          type: string
          nullable: true
        # Which face of the tree the photo was taken from. Used by field
        # workers to disambiguate canopy/trunk shots so reviewers can see
        # all four cardinal sides over time. N/E/S/W are compass-relative
        # to the worker's facing direction; "canopy" = looking up into the
        # crown; "trunk" = close-up of the trunk.
        photoSide:
          type: string
          enum: [N, E, S, W, canopy, trunk]
          nullable: true
        # What kind of report this photo represents. Field workers in the
        # simplified capture flow tag every upload with one of these so a
        # photo + notes IS the report — no separate scout/phenology/etc.
        # forms. `general` is the catch-all when no specific kind applies.
        reportType:
          type: string
          enum: [general, phenology, scout, irrigation, treatment, weather, harvest, damage]
          nullable: true
        caption:
          type: string
          nullable: true
        linkedEntityType:
          type: string
          nullable: true
        linkedEntityId:
          type: integer
          nullable: true
        analysisProvider:
          type: string
          enum: [auto, local_heuristic, external_vision_model, manual_only]
          nullable: true
        analysisContext:
          type: string
          enum: [general_tree_review, harvest_pre_tree, harvest_box, pest_or_disease_check, pruning_assessment, damage_or_anomaly]
          nullable: true
        batchId:
          type: integer
          nullable: true

    BulkLinkPhotosRequest:
      type: object
      required: [mediaIds]
      properties:
        mediaIds:
          type: array
          items: { type: integer }
        treeId:
          type: integer
          nullable: true
        groveId:
          type: integer
          nullable: true

    BulkLinkPhotosResponse:
      type: object
      required: [updated, requested, failedIds, photos]
      properties:
        updated: { type: integer }
        requested: { type: integer }
        failedIds:
          type: array
          items: { type: integer }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PhotoLibraryItem"

    RelinkPhotosRequest:
      type: object
      required: [mediaIds, linkedEntityType, linkedEntityId]
      properties:
        mediaIds:
          type: array
          items: { type: integer }
        linkedEntityType: { type: string }
        linkedEntityId: { type: integer }

    SweepPendingPhotosRequest:
      type: object
      properties:
        # Override the default TTL (env PENDING_PHOTO_TTL_HOURS or 24h).
        # Anything older than (now - ttlHours) is considered abandoned.
        ttlHours:
          type: number
          minimum: 0
          nullable: true
        # If true, return the candidate count and ids without deleting anything.
        dryRun:
          type: boolean
          nullable: true

    SweepPendingPhotosResponse:
      type: object
      required:
        [
          ttlHours,
          cutoff,
          dryRun,
          scanned,
          deletedMediaIds,
          storageDeletedCount,
          storageFailedCount,
        ]
      properties:
        ttlHours: { type: number }
        cutoff: { type: string, format: date-time }
        dryRun: { type: boolean }
        scanned: { type: integer }
        deletedMediaIds:
          type: array
          items: { type: integer }
        storageDeletedCount: { type: integer }
        storageFailedCount: { type: integer }

    FinalizeUploadResponse:
      type: object
      required: [media]
      properties:
        media:
          $ref: "#/components/schemas/PhotoLibraryItem"
        analysis:
          $ref: "#/components/schemas/PhotoAnalysisJobWithResult"
          nullable: true

    PhotoLibraryItem:
      type: object
      required: [id, fileUrl, uploadedAt, purpose]
      properties:
        id: { type: integer }
        entityType: { type: string }
        entityId: { type: integer }
        fileUrl: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        purpose: { type: string }
        # Why the photo→tree auto-link step succeeded or failed for this
        # row. Surfaced to managers in the photo library so they can
        # triage unlinked uploads without inspecting raw EXIF.
        matchStatus:
          type: string
          enum:
            - linked_explicit
            - linked_gps
            - unlinked_no_gps
            - unlinked_no_match
            - unlinked_exif_error
          nullable: true
        treeId: { type: integer, nullable: true }
        treeCode: { type: string, nullable: true }
        groveId: { type: integer, nullable: true }
        groveName: { type: string, nullable: true }
        zone: { type: string, nullable: true }
        photoSide:
          type: string
          enum: [N, E, S, W, canopy, trunk]
          nullable: true
        reportType:
          type: string
          enum: [general, phenology, scout, irrigation, treatment, weather, harvest, damage]
          nullable: true
        capturedAt: { type: string, format: date-time, nullable: true }
        gpsLat: { type: number, nullable: true }
        gpsLon: { type: number, nullable: true }
        originalFileName: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        fileSizeBytes: { type: integer, nullable: true }
        widthPx: { type: integer, nullable: true }
        heightPx: { type: integer, nullable: true }
        caption: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time }
        uploadedByUserId: { type: integer, nullable: true }
        uploadedByName: { type: string, nullable: true }
        linkedEntityType: { type: string, nullable: true }
        linkedEntityId: { type: integer, nullable: true }
        latestAnalysis:
          $ref: "#/components/schemas/PhotoAnalysisResultRich"
          nullable: true

    RunAnalysisRequest:
      type: object
      required: [mediaId]
      properties:
        mediaId: { type: integer }
        provider:
          type: string
          enum: [auto, local_heuristic, external_vision_model, manual_only]
          nullable: true
        context:
          type: string
          enum: [general_tree_review, harvest_pre_tree, harvest_box, pest_or_disease_check, pruning_assessment, damage_or_anomaly]
          nullable: true
        batchId:
          type: integer
          nullable: true
        force:
          type: boolean
          nullable: true

    PossiblePestCue:
      type: object
      required: [cue, severity]
      properties:
        cue: { type: string }
        severity: { type: string }
        notes: { type: string, nullable: true }

    PhotoAnalysisJob:
      type: object
      required: [id, mediaId, provider, context, status, createdAt]
      properties:
        id: { type: integer }
        mediaId: { type: integer }
        batchId: { type: integer, nullable: true }
        provider: { type: string }
        context: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        errorMessage: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PhotoAnalysisResultRich:
      type: object
      required: [id, mediaId, provider, context, reviewStatus, needsFieldVerification, createdAt]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        mediaId: { type: integer }
        media:
          $ref: "#/components/schemas/PhotoLibraryItem"
        treeId: { type: integer, nullable: true }
        treeCode: { type: string, nullable: true }
        groveId: { type: integer, nullable: true }
        groveName: { type: string, nullable: true }
        provider: { type: string }
        context: { type: string }
        imageQuality: { type: string, nullable: true }
        blurScore: { type: number, nullable: true }
        brightnessScore: { type: number, nullable: true }
        widthPx: { type: integer, nullable: true }
        heightPx: { type: integer, nullable: true }
        canopyDensity: { type: string, nullable: true }
        canopyGreennessScore: { type: number, nullable: true }
        yellowingSignal: { type: string, nullable: true }
        droughtStressVisualSignal: { type: string, nullable: true }
        pruningNeedSignal: { type: string, nullable: true }
        fruitMaturityVisualEstimate: { type: string, nullable: true }
        fruitDamageSignal: { type: string, nullable: true }
        understoryVisualSignal: { type: string, nullable: true }
        trunkConditionSignal: { type: string, nullable: true }
        rootExposureSignal: { type: string, nullable: true }
        terraceConditionSignal: { type: string, nullable: true }
        possiblePestOrDiseaseCues:
          type: array
          items:
            $ref: "#/components/schemas/PossiblePestCue"
        summary: { type: string, nullable: true }
        limitations: { type: string, nullable: true }
        recommendedFollowUp: { type: string, nullable: true }
        recommendedTaskType: { type: string, nullable: true }
        confidenceScore: { type: number, nullable: true }
        needsFieldVerification: { type: string }
        reviewStatus:
          type: string
          enum: [pending, confirmed, rejected, needs_verification]
        reviewedByUserId: { type: integer, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNotes: { type: string, nullable: true }
        createdTaskId: { type: integer, nullable: true }
        linkedHeritageRuleId: { type: integer, nullable: true }
        linkedRuleEvidenceId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PhotoAnalysisJobWithResult:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/PhotoAnalysisJob"
        result:
          $ref: "#/components/schemas/PhotoAnalysisResultRich"
          nullable: true

    ReviewAnalysisRequest:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus:
          type: string
          enum: [confirmed, rejected, needs_verification, pending]
        reviewNotes:
          type: string
          nullable: true
        # NOTE: reviewedByUserId is intentionally NOT accepted from
        # clients. The server derives it from the manager session
        # cookie so review events cannot be spoofed.

    CreateTaskFromAnalysisRequest:
      type: object
      required: [taskType, priority, title]
      properties:
        taskType: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
        title: { type: string }
        description: { type: string, nullable: true }
        assignedToUserId: { type: integer, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        treeId: { type: integer, nullable: true }
        groveId: { type: integer, nullable: true }

    LinkAnalysisToRuleRequest:
      type: object
      required: [heritageRuleId]
      # NOTE: `evidenceType`/`confidenceScore` are intentionally NOT in this
      # schema. The server derives `metricName`, `metricValue`,
      # `confidenceLevel`, and the entity scope (field-visit / harvest-event /
      # tree / grove) directly from the stored analysis result + linked media,
      # so a client cannot spoof the audit trail of a heritage-rule evidence
      # link. The optional free-text `evidence` is only used as the human
      # `interpretation` override.
      properties:
        heritageRuleId: { type: integer }
        evidence: { type: string, nullable: true }


        fileUrl:
          type: string
        caption:
          type: string
          nullable: true
        uploadedByUserId:
          type: integer
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        treeId:
          type: integer
          nullable: true
        groveId:
          type: integer
          nullable: true
        zone:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
        gpsLat:
          type: number
          nullable: true
        gpsLon:
          type: number
          nullable: true
        purpose:
          type: string
          nullable: true
        linkedEntityType:
          type: string
          nullable: true
        linkedEntityId:
          type: integer
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        originalFileName:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        fileSizeBytes:
          type: integer
          nullable: true
        widthPx:

              date: { type: string }
              cumulativeMm: { type: number }
        longTermDailyCumulative:
          type: array
          description: Long-term average cumulative rainfall by day-of-year across all prior years (sampled at observed dates).
          items:
            type: object
            required: [date, cumulativeMm]
            properties:
              date: { type: string }
              cumulativeMm: { type: number }

